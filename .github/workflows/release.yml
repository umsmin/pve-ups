name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches __version__
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match __version__ $VERSION" >&2
            exit 1
          fi

      - name: Build dist tarball
        run: bash scripts/make-dist.sh --committed "$GITHUB_REF_NAME"

      - name: Extract changelog highlights for the release body
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The release notes carry the short "### Highlights" block only (3-4 bullets,
          # the same ones the manuals show); the unabridged version stays in CHANGELOG.md.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^### Highlights/ {hl=1; next}
            hl && /^### / {exit}
            hl {print}
          ' CHANGELOG.md > release-body.md
          # fall back to the whole section for tags predating the Highlights convention
          if ! grep -q "[^[:space:]]" release-body.md; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" {on=1; next}
              on && /^## \[/ {exit}
              on {print}
            ' CHANGELOG.md > release-body.md
          fi
          # ... and to a minimal body if the section is missing/empty as well
          if ! grep -q "[^[:space:]]" release-body.md; then
            echo "Release $GITHUB_REF_NAME" > release-body.md
          fi
          printf '\nFull changelog: %s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-body.md

      - name: Create GitHub release with assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: |
            dist/pve-usv-*.tar.gz
            install.sh

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches __version__
        id: version
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match __version__ $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ffind-dev/pve-ups:${{ steps.version.outputs.version }}
            ghcr.io/ffind-dev/pve-ups:${{ github.ref_name }}
            ghcr.io/ffind-dev/pve-ups:latest
